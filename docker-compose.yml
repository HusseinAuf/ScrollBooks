networks:
  default:
    external:
      name: scrollbooks-network

services:
  db:
    image: postgres:14.5
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    ports:
      - "5435:5432"
    healthcheck:
      # CMD-SHELL: tells docker to run this command using a shell inside the container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine

  api: &api
    build:
      context: backend
      args:
        ENV_MODE: ${ENV_MODE} # Pass from .env
    env_file:
      - .env
    volumes:
      - ./backend:/home/scrollbooks
      - ./backend/api/storage:/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      uvicorn api.asgi:application
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /home/scrollbooks/api

  celeryworker:
    <<: *api
    ports: []
    # -l: set log level to INFO (--loglevel)
    # -A api: use the Celery app from the Python package/module named "api"
    command: bash -c "cd api && poetry run celery -A api worker -l info"

  celerybeat:
    <<: *api
    ports: []
    command: bash -c "cd api && poetry run celery -A api beat -l info"

  frontend:
    build:
      context: frontend
    volumes:
      - ./frontend:/home/scrollbooks
      - /home/scrollbooks/node_modules
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env
    stdin_open: true # Useful for development/debugging
    tty: true # Useful for development/debugging

volumes:
  postgres_data:
  postgres_backups:
